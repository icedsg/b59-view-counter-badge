{{/* Hugo. Save as layouts/shortcodes/views.html, then in a page: {{< views "YOUR-TRACKER-ID" >}}
     Counts the visit and shows the badge for the current page. */}}
{{ $id := .Get 0 }}
<img src="https://b59.link/badge.svg?id={{ $id }}&path={{ .Page.RelPermalink | urlquery }}" alt="views" height="20">
<script>(function(){var i=new Image();i.referrerPolicy="no-referrer-when-downgrade";
i.src="https://b59.link/tag?id={{ $id }}&u="+encodeURIComponent(location.href)+"&r="+encodeURIComponent(document.referrer);})();</script>
